name: "🚀 Build & Publish Docker"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/**"
      - "ubuntu-gnome/**"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docker:
    name: "🐳 Build Ubuntu ${{ matrix.ubuntu_version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "20.04"
            tag: "2004"
            experimental: false
          - ubuntu_version: "22.04"
            tag: "2204"
            experimental: false
          - ubuntu_version: "24.04"
            tag: "2404"
            experimental: false
          # Ubuntu 26.04 的 GNOME 50 移除了 X11 会话、GNOME Remote Desktop 50
          # 移除了 VNC 后端，原有 X11 架构无法工作，暂作为实验性构建。
          - ubuntu_version: "26.04"
            tag: "2604"
            experimental: true

    # 实验版本构建失败不影响整体结果
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: "📂 拉取源码"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🏗️ 设置 Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 登录到 DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: "📤 构建并推送 Docker 镜像 (${{ matrix.tag }})"
        uses: docker/build-push-action@v6
        with:
          context: ./ubuntu-gnome
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-gnome-vnc:${{ matrix.tag }}
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: "🧪 冒烟测试"
        if: matrix.experimental == false
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-gnome-vnc:${{ matrix.tag }}"
          docker pull "$IMAGE"

          # 必须使用 cgroup v2，否则 systemd 无法在容器内启动
          stat -fc %T /sys/fs/cgroup

          docker run -d --privileged --name smoke \
            --shm-size=2g \
            -p 6080:6080 -p 5901:5901 \
            -e VNC_PASSWORD=smoketest \
            "$IMAGE"

          ok=0
          for i in $(seq 1 60); do
            if docker exec smoke pgrep -x gnome-shell >/dev/null 2>&1; then
              ok=1
              echo "gnome-shell 已就绪（${i}0s）"
              break
            fi
            sleep 10
          done

          echo "--- 服务日志 ---"
          docker exec smoke journalctl -u desktop-vnc -n 40 --no-pager || true

          if [ "$ok" != "1" ]; then
            echo "::error::gnome-shell 未能在 10 分钟内启动"
            exit 1
          fi

          curl -sk --max-time 15 -o /dev/null -w "noVNC HTTP %{http_code}\n" \
            https://localhost:6080/vnc.html

          docker exec smoke ss -lntp | grep 5901

      - name: "🧹 清理"
        if: always()
        run: docker rm -f smoke 2>/dev/null || true
